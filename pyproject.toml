[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-backup"
version = "0.5.1"
description = "Verified, scheduled backups for Linux desktops and servers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Universal Backup contributors"}]
keywords = ["backup", "linux", "ubuntu", "sha256", "incremental-backup"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
universal-backup = "universal_backup.cli:main"
universal-backup-ui = "universal_backup.desktop:main"

[tool.setuptools.packages.find]
include = ["universal_backup*"]
